name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked environment
        run: python -m pip install -r requirements.lock -e . --no-deps
      - name: Ruff
        run: python -m ruff check src scripts tests
      - name: Mypy
        run: python -m mypy
      - name: Normative manifest audit
        run: python scripts/audit_normative_manifest.py
      - name: Catalog drift audit
        run: python scripts/validate_catalog.py
      - name: Determinism audit
        run: python scripts/validate_determinism.py
      - name: Tests and branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Memorial generation smoke test
        run: |
          python scripts/generate_reproducible_record.py --commit "${GITHUB_SHA}"
          python -m pytest tests/test_memorial_detailed.py tests/test_reproducible_record.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            build/reproducible_analysis_record.json

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked environment and mutation runner
        run: |
          python -m pip install -r requirements.lock -e . --no-deps
          python -m pip install mutmut==3.6.0
      - name: Critical flexure mutation campaign
        id: mutation
        continue-on-error: true
        run: mutmut run
      - name: Record mutation results
        if: always()
        run: |
          set +e
          mutmut results | tee mutation-results.txt
          echo "run_outcome=${{ steps.mutation.outcome }}" >> mutation-results.txt
          awk -F: '/survived/{gsub(/^ +/, "", $1); print $1}' mutation-results.txt |
            while read -r mutant; do
              echo "===== ${mutant} =====" >> mutation-details.txt
              mutmut show "${mutant}" >> mutation-details.txt
            done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            mutation-details.txt
