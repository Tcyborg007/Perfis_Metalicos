[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perfis-metalicos"
version = "0.1.0"
description = "Motor auditável para análise de perfis metálicos dentro de escopo declarado"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.46.1",
    "pandas==2.3.1",
    "plotly==6.2.0",
    "openpyxl==3.1.5",
    "pytz==2025.2",
    "numpy==2.4.2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "coverage==7.12.0",
    "mypy==1.17.1",
    "pytest==8.4.2",
    "pytest-cov==6.3.0",
    "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/perfis_metalicos"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["src/perfis_metalicos"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
